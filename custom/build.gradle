plugins {
  id "java"
}

dependencies {
  compileOnly "io.opentelemetry:opentelemetry-sdk:${otelSdkVersion}"
  compileOnly "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure:${otelSdkVersion}"
