plugins {
  id "com.diffplug.spotless" version "7.0.3"
  id "com.gradleup.shadow" version "8.3.8" apply false
}

group = 'dev.zio'
version = '2.28.1'

ext {
  otelSdkVersion = '1.62.0'
  otelAgentVersion = '2.28.1'
  zioVersion = '2.1.25'
  scalaVersion = '2.13'
  scalaFullVersion = '2.13.16'
}

subprojects {
  plugins.withId("java") {
    java {
      toolchain {
        languageVersion = JavaLanguageVersion.of(8)
      }
    }
  }
}

spotless {
  java {
    googleJavaFormat()
  }
}
