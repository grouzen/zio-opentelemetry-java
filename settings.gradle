pluginManagement {
  repositories {
    gradlePluginPortal()
    mavenCentral()
  }
}

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    mavenLocal()
    ivy {
      url = file("${System.properties['user.home']}/.ivy2/local")
      patternLayout {
        artifact "[organisation]/[module]/[revision]/[type]s/[artifact](-[classifier]).[ext]"
        ivy "[organisation]/[module]/[revision]/ivys/ivy.xml"
      }
      metadataSources {
        ivyDescriptor()
        artifact()
      }
    }
    mavenCentral()
  }
}

rootProject.name = 'zio-opentelemetry-java'

include ':opentelemetry-api-shaded-for-instrumenting'
include ':agent'
include ':bootstrap'
include ':custom'
include ':instrumentation:zio-common-2.1'
include ':instrumentation:zio-2.1'
include ':instrumentation:zio-telemetry-agent-4.0'
include ':smoke-tests-images:zio-http'
include ':smoke-tests'
include ':testing:agent-for-testing'
